<ion-toolbar>
  <ion-title>
    <div class="head">
      <h1 style="font-weight:bold">Tous Vos Documents </h1>
    </div>
  </ion-title>
</ion-toolbar>
<ion-content>
  <div  class="mes-cours-content">

    <div>
      <app-banniere-buy></app-banniere-buy>
    </div>
  <div class="course-text-section">
    <ion-button (click)="setVisible()" color="light" class="Doc-btn" >
      <label>Cours pdf</label>
      <ion-icon *ngIf="!visible" name="chevron-down-outline"></ion-icon>
      <ion-icon *ngIf="visible" name="chevron-up-outline"></ion-icon>
    </ion-button>
  
  <div *ngIf="visible">
    <ng-container *ngIf="courses.length > 0; else noCourses">
      <div *ngFor="let course of courses">
      <app-course-card [course]="course" [isPaid]="true" ></app-course-card>
      </div>
    </ng-container>

    <ng-template #noCourses>
      <ion-text color="medium">
        <p>Vous n'avez aucun cours disponible pour le moment.</p>
      </ion-text>
    </ng-template>
  </div>

  <ion-button (click)="setExoVisible()" color="light" class="Doc-btn" >
    <label>Exercices et Corrections</label>
    <ion-icon *ngIf="!exoVisible" name="chevron-down-outline"></ion-icon>
    <ion-icon *ngIf="exoVisible" name="chevron-up-outline"></ion-icon>
  </ion-button>

  <div *ngIf="exoVisible">
    <ng-container *ngIf="filteredExamForMyCourse.length>0; else noExams">
      <app-exam-card *ngFor="let exam of filteredExamForMyCourse" [exam]="exam" direction="row"></app-exam-card>
    </ng-container>

    <ng-template #noExams>
      <ion-text color="medium">
        <p>Aucun sujet d'exam disponible</p>
      </ion-text>
    </ng-template>
  </div>
  </div>
  </div>
</ion-content>
