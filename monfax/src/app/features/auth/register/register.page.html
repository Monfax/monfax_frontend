
<ion-header>
  <ion-toolbar>
    <ion-title>Sign Up</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <div class="logo-container">
      <img src="../../../../assets/icon/MonFaxLogo.png" alt="monFax Logo" class="logo" />
    </div>
    <h2 class="title">Getting Started!</h2>
    <p class="subtitle">Create an Account to Unlock Your Courses</p>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="form-container">
      <ion-item class="input-item">
        <ion-icon name="person" slot="start"></ion-icon>
        <ion-label position="floating">Name</ion-label>
        <ion-input type="text" formControlName="name"></ion-input>
      </ion-item>
      <ion-item class="input-item">
        <ion-icon name="mail" slot="start"></ion-icon>
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>
      <ion-item class="input-item">
        <ion-icon name="lock-closed" slot="start"></ion-icon>
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" formControlName="password"></ion-input>
      </ion-item>
      <ion-item class="input-item">
        <ion-icon name="lock-closed" slot="start"></ion-icon>
        <ion-label position="floating">Confirm Password</ion-label>
        <ion-input type="password" formControlName="confirmPassword"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="errorMessage" class="error-message">{{ errorMessage }}</ion-text>

      <ion-button expand="block" type="submit" [disabled]="!registerForm.valid" class="primary-button">
        <ion-icon name="arrow-forward" slot="end"></ion-icon>
        Sign Up
      </ion-button>

      <p class="text-center alternate-text">Or Continue With</p>
      <ion-button expand="block" color="light" (click)="googleLogin()" class="google-button">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Sign Up with Google
      </ion-button>

      <p class="text-center login-link">
        Already have an Account? <a routerLink="/login">Sign In</a>
      </p>
    </form>
  </div>
</ion-content>
