
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button  ></ion-back-button>
    </ion-buttons>
    <ion-title>{{subject_name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="course-grid">
    <app-lecture-course-card
      *ngFor="let c of filteredCourses"
      [course]="c"
    ></app-lecture-course-card>
  </div>
</ion-content>
