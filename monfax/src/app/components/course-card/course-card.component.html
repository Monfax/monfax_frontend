

      <div class="course-card" 
        (click)="onOpenSubject(course.id,course.name)"
        [ngClass]="{'row-direction': direction === 'row', 'column-direction': direction === 'column'}">
        <img src="assets/default-img-course.png" alt="thumbnail"/>
        <div class="product-card">
          <div class="header">
            <div class="tag"><span> {{course.filiere}} </span> <span> {{course.niveau}} </span> </div>
            <div class="lock-icon">
              <ion-icon *ngIf="!isPaid" name="lock-closed-outline"></ion-icon>
              <ion-icon *ngIf="isPaid" name="checkmark-circle" color="selected"></ion-icon>
            </div>
          </div>
          <h2 class="title"> {{course.name}} </h2>
          <div class="details">
            <span *ngIf="!isPaid" class="price">{{ course.price}} fcfa</span>
            <span *ngIf="isPaid" style="color:rgb(231, 231, 231)">{{ course.price}} fcfa</span>

            <span  class="separator">|</span>

            <span class="rating">
              <ion-icon name="star"></ion-icon>
            </span>
            <span class="separator">|</span>
            <span  class="sales">100 view</span>
          
          </div>
        </div>
        <!-- <ion-spinner *ngIf="loadingCourse" name="dots" slot="start"></ion-spinner> -->
      </div>
