<ion-content >
    <div class="cours-container">
    <div class="toolbar">
      <div class="head">
        <h1 class="title">Nos Cours</h1>
        <ion-icon (click)="setVisible()" name="filter" color="primary" class="filter-button"></ion-icon>
      </div>
      <div class="buttons-header">

        <ion-button
          shape="round" 
          class="button-contenu"
          [color]="selectedContenu === 'Cours' ? 'primary' : 'light'"
          (click)="selectContenu('Cours')"
          >
          Document
        </ion-button>

        <ion-button
          shape="round" 
          class="button-contenu"
          [color]="selectedContenu === 'Video' ? 'primary' : 'light'"
          (click)="selectContenu('Video')"
          >
          Video
        </ion-button>

      </div>
    </div>
      <div *ngIf="visible" class="sous-section">
        <div class="side-title">
          <label>Filtre</label>
          <ion-icon class="filter-button" name="close" (click)="closeSide()" ></ion-icon>
        </div>
        <ion-button 
          [color]="selectedSemestre === null ? 'selected' : 'light'"
          shape="round"
          (click)="selectSemestre(null)">
          Tout
        </ion-button>

        <div class="semester-container" >
          <div *ngFor="let semestre of SemestresData">
            <ion-button
              shape="round"
              [color]="selectedSemestre === semestre.name ? 'selected' : 'light'"
              (click)="selectSemestre(semestre.name)">
              {{ semestre.name }}
            </ion-button>
          </div>
        </div>
      
      </div>
    </div>
    <div class="cours-list" *ngFor="let cour of cours">
      <app-course-card [course]="cour" direction="row" ></app-course-card>
    </div>
  </ion-content>
